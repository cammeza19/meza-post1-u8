spring.application.name=auditoria-hallazgos

# Base de datos H2 en memoria (Frameworks & Drivers)
spring.datasource.url=jdbc:h2:mem:auditoriadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 para inspeccionar las tablas hallazgos e historial_cambios_estado
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON legible en las respuestas y fechas en formato ISO-8601
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
